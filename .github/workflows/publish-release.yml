name: Publish verified release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing draft tag to verify and publish (for example v0.1.11)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  # Must match release.yml so draft assets cannot be reset while publication
  # is taking its verification snapshot.
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    environment: production-release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout draft tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Confirm immutable draft target
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          test "$(jq -r '.draft' <<< "$RELEASE_JSON")" = "true"
          TAG_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
          test "$TAG_SHA" = "$(git rev-parse HEAD)"
          echo "TAG_SHA=$TAG_SHA" >> "$GITHUB_ENV"
          node scripts/validate-version-lock.mjs "$RELEASE_TAG"

      - name: Download complete draft inventory
        run: |
          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.id')"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
            | jq '[.[][]] | sort_by(.name) | map({id, name, size, updated_at, digest})' \
            > release-assets-snapshot.json
          mkdir release-assets
          gh release download "$RELEASE_TAG" --dir release-assets

      - name: Verify native smoke report and all release evidence after approval
        run: |
          node scripts/verify-release-assets.mjs --assets release-assets --tag "$RELEASE_TAG" --phase publish --commit "$TAG_SHA"
          node scripts/verify-updater-signatures.mjs release-assets src-tauri/tauri.conf.json

      - name: Publish verified draft
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          VERIFIED_TAG_SHA: ${{ env.TAG_SHA }}
        with:
          script: |
            const fs = require('fs');
            const tag = process.env.RELEASE_TAG;
            if (!/^v\d+\.\d+\.\d+(?:[-.][0-9A-Za-z.-]+)?$/.test(tag)) {
              throw new Error('Invalid release tag');
            }
            const release = (await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            })).data;
            if (!release.draft) throw new Error(`${tag} is not a draft`);
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              per_page: 100,
            });
            const assetIdentity = asset => ({
              id: asset.id,
              name: asset.name,
              size: asset.size,
              updated_at: asset.updated_at,
              digest: asset.digest ?? null,
            });
            const expectedAssets = JSON.parse(fs.readFileSync('release-assets-snapshot.json', 'utf8'));
            const currentAssets = assets.map(assetIdentity).sort((left, right) => (
              left.name < right.name ? -1 : left.name > right.name ? 1 : 0
            ));
            if (JSON.stringify(currentAssets) !== JSON.stringify(expectedAssets)) {
              throw new Error('Draft assets changed after release verification');
            }
            if (!assets.some(asset => asset.name === 'native-smoke-report.json')) {
              throw new Error('native-smoke-report.json disappeared before publish');
            }
            const tagRef = (await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${tag}`,
            })).data.object;
            let tagSha = tagRef.sha;
            if (tagRef.type === 'tag') {
              tagSha = (await github.rest.git.getTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_sha: tagRef.sha,
              })).data.object.sha;
            }
            if (tagSha !== process.env.VERIFIED_TAG_SHA) {
              throw new Error('Tag target changed after release verification');
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              name: `AI Chat Multiplexer ${tag}`,
              draft: false,
              prerelease: false,
              make_latest: 'true',
            });
