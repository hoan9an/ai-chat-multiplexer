name: Release candidate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  # Candidate creation mutates the same draft later consumed by the publish
  # workflow. Both workflows intentionally share this tag-scoped lock.
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-source:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and version lock
        run: |
          git diff --exit-code
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          node scripts/validate-version-lock.mjs "$GITHUB_REF_NAME"

      - name: Frontend and release verifier tests
        run: |
          npm run build
          npm test
          npm run test:release

  create-release:
    needs: validate-source
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}
    steps:
      - name: Create or reset draft release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
              if (!release.draft) {
                core.setFailed(`Release ${tag} is already published. Published assets are immutable.`);
                return;
              }
              const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
                owner,
                repo,
                release_id: release.id,
                per_page: 100,
              });
              for (const asset of assets) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `AI Chat Multiplexer ${tag} release candidate`,
                body: [
                  'Release candidate. Do not distribute until the automated artifact gate,',
                  'Windows native smoke report, and production-release approval all pass.',
                  '',
                  'Supported target: Windows 10/11 x64 with WebView2 Evergreen.',
                  'macOS and Linux artifacts are experimental and unsupported.',
                ].join('\n'),
                draft: true,
                prerelease: false,
              })).data;
            }
            core.setOutput('release_id', release.id);

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            windows_signing: false
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            windows_signing: false
          - platform: ubuntu-22.04
            args: ""
            windows_signing: false
          - platform: windows-latest
            args: "--config src-tauri/tauri.windows-signing.conf.json"
            windows_signing: true
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Require Windows Authenticode credentials
        if: matrix.windows_signing
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_TIMESTAMP_URL_SECRET: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          if (-not $env:WINDOWS_SIGNING_PFX_BASE64) { throw 'WINDOWS_SIGNING_PFX_BASE64 is required' }
          if (-not $env:WINDOWS_SIGNING_PFX_PASSWORD) { throw 'WINDOWS_SIGNING_PFX_PASSWORD is required' }
          if (-not $env:WINDOWS_TIMESTAMP_URL_SECRET) { throw 'WINDOWS_TIMESTAMP_URL is required' }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'windows-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password -Exportable:$false
          if (-not $certificate.HasPrivateKey) { throw 'Imported certificate has no private key' }
          "WINDOWS_SIGNING_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WINDOWS_TIMESTAMP_URL=$env:WINDOWS_TIMESTAMP_URL_SECRET" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Remove-Item -LiteralPath $pfxPath -Force

      - name: Build, sign updater artifacts, and upload to draft
        uses: tauri-apps/tauri-action@v0
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Verify Windows Authenticode and write report
        if: matrix.windows_signing
        shell: pwsh
        run: |
          ./scripts/write-authenticode-report.ps1 `
            -BundleRoot './src-tauri/target/release/bundle' `
            -OutputPath './authenticode-report.json'
          gh release upload "$env:GITHUB_REF_NAME" './authenticode-report.json' --clobber

  automated-artifact-gate:
    needs: [create-release, build-tauri]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Download draft release assets
        run: |
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" --dir release-assets

      - name: Generate one complete updater manifest
        run: |
          PUB_DATE="$(git show -s --format=%cI "$GITHUB_SHA")"
          node scripts/write-updater-manifest.mjs \
            --assets release-assets \
            --tag "$GITHUB_REF_NAME" \
            --pub-date "$PUB_DATE"

      - name: Verify generated asset inventory
        run: node scripts/verify-release-assets.mjs --assets release-assets --tag "$GITHUB_REF_NAME" --phase build

      - name: Add source archive, checksums, and provenance
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="ai-chat-multiplexer-${VERSION}/" \
            -o "release-assets/ai-chat-multiplexer-${VERSION}-source.tar.gz" "$GITHUB_SHA"
          node scripts/write-release-reports.mjs \
            --assets release-assets \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --workflow-run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Verify hashes, provenance, manifest, and updater signatures
        run: |
          node scripts/verify-release-assets.mjs --assets release-assets --tag "$GITHUB_REF_NAME" --phase automated --commit "$GITHUB_SHA"
          node scripts/verify-updater-signatures.mjs release-assets src-tauri/tauri.conf.json

      - name: Upload verification assets to draft
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            'release-assets/latest.json' \
            "release-assets/ai-chat-multiplexer-${VERSION}-source.tar.gz" \
            'release-assets/SHA256SUMS.txt' \
            'release-assets/release-provenance.json' \
            --clobber

      - name: Update draft release notes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = context.ref.replace('refs/tags/', '');
            const release = (await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            })).data;
            if (!release.draft) throw new Error('Refusing to modify a published release');
            const sums = fs.readFileSync('release-assets/SHA256SUMS.txt', 'utf8').trim();
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              name: `AI Chat Multiplexer ${tag} release candidate`,
              body: [
                '## Support status',
                '',
                '- Supported after native smoke approval: Windows 10/11 x64 with WebView2 Evergreen.',
                '- Experimental and unsupported: macOS and Linux artifacts.',
                '- Tauri updater signatures and Authenticode were verified by the release gate.',
                '- Publication still requires `native-smoke-report.json`, production approval, and post-publication updater smoke follow-up.',
                '',
                `Source commit: ${context.sha}`,
                `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '## SHA256',
                '',
                '```text',
                sums,
                '```',
              ].join('\n'),
            });

      - name: Release candidate summary
        run: |
          echo "Release candidate ${GITHUB_REF_NAME} remains draft." >> "$GITHUB_STEP_SUMMARY"
          echo "Complete scripts/native-smoke-report.template.json and upload it to the draft before running Publish release." >> "$GITHUB_STEP_SUMMARY"
          echo "The updater install/restart case may remain BLOCKED for draft publication and must be exercised immediately after publishing." >> "$GITHUB_STEP_SUMMARY"
