name: Release

# Builds, signs, and publishes desktop bundles + the updater `latest.json`
# manifest when a version tag (e.g. v0.1.6) is pushed. The updater plugin's
# configured endpoint resolves to the `latest.json` produced here.
#
# REQUIRED repository secrets (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY           - contents of the private key generated by
#                                         `npm run tauri signer generate`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  - the password chosen when generating it
# The PRIVATE key is NEVER committed to the repo. Only the matching PUBLIC key
# lives in src-tauri/tauri.conf.json (plugins.updater.pubkey).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Create a single draft release FIRST so the parallel build matrix uploads its
  # bundles into one shared draft. Letting each matrix job create its own release
  # via tauri-action races and produces duplicate drafts for the same tag.
  create-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}
    steps:
      - name: Create or reuse draft release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Reuse an existing release for this tag if one is already present,
            // otherwise create a fresh draft. This keeps re-runs idempotent. When
            // reusing a draft, delete stale draft assets so matrix uploads replace
            // previous failed/partial artifacts. Never delete assets from a
            // published release.
            let release;
            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = existing.data;
              if (release.draft) {
                const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
                  owner,
                  repo,
                  release_id: release.id,
                  per_page: 100,
                });
                for (const asset of assets) {
                  await github.rest.repos.deleteReleaseAsset({
                    owner,
                    repo,
                    asset_id: asset.id,
                  });
                }
              }
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: `AI Chat Multiplexer ${tag}`,
                body: 'See the assets below to download and install this version.',
                draft: true,
                prerelease: false,
              });
              release = created.data;
            }

            core.setOutput('release_id', release.id);

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build, sign, and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Upload into the single draft created by the create-release job so all
          # four matrix builds (and their updater manifests) land in one release.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # Generates the updater `latest.json` manifest alongside the bundles so
          # the configured updater endpoint resolves.
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # Flip the draft to published only AFTER all matrix builds succeed, so every
  # bundle and the updater `latest.json` are present. Until this runs, GitHub's
  # `releases/latest` resolves to the previous published release (which lacks
  # `latest.json`), causing the updater to 404. Publishing here is what makes the
  # updater endpoint resolve for end users.
  publish-release:
    needs: [create-release, build-tauri]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish the release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
              make_latest: 'true',
            });
