name: Setup minisign
description: Install a pinned minisign binary on GitHub Ubuntu runners.
runs:
  using: composite
  steps:
    - name: Install pinned minisign
      shell: bash
      run: |
        set -euo pipefail

        version="0.12"
        archive="${RUNNER_TEMP}/minisign-${version}-linux.tar.gz"
        install_dir="${RUNNER_TEMP}/minisign-${version}"

        curl -fsSL \
          "https://github.com/jedisct1/minisign/releases/download/${version}/minisign-${version}-linux.tar.gz" \
          -o "${archive}"
        echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  ${archive}" | sha256sum -c -

        mkdir -p "${install_dir}"
        tar -xzf "${archive}" -C "${install_dir}"
        sudo install -m 0755 "${install_dir}/minisign-linux/x86_64/minisign" /usr/local/bin/minisign
        test -x /usr/local/bin/minisign
